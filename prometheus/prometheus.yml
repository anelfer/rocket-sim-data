global:
  scrape_interval: 1s
  evaluation_interval: 1s
  scrape_timeout: 1s

scrape_configs:
  - job_name: 'rocket-telemetry'
    static_configs:
      - targets: ['rocket-simulator:8086']
        labels:
          instance: 'rocket-telemetry-simulator'
          service: 'rocket-simulator'
    metrics_path: '/actuator/prometheus'

